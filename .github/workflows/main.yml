name: Mobile APK Builder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: flutter create . --platforms=android

      - name: Configure SDK 35 globally in gradle.properties
        run: |
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
          
          # Inject compileSdkVersion into app build file safely
          python3 -c "
          import os, re
          
          app_gradle = 'android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f:
                  content = f.read()
              
              # Replace compileSdk or compileSdkVersion with 35
              content = re.sub(r'compileSdk\s*=.*', 'compileSdk = 35', content)
              content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 35', content)
              
              with open(app_gradle, 'w') as f:
                  f.write(content)
          "

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportManagerPro-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          
