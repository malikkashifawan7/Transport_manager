name: Mobile APK Builder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: flutter create . --platforms=android

      - name: Fetch Pub Dependencies
        run: flutter pub get

      - name: Patch Global Pub Cache & Project for SDK 36
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          python3 -c "
          import os, re

          # 1. Update all build.gradle files in Pub Cache (Plugins like share_plus)
          pub_cache = os.path.expanduser('~/.pub-cache')
          if os.path.exists(pub_cache):
              for root, dirs, files in os.walk(pub_cache):
                  for file in files:
                      if file in ['build.gradle', 'build.gradle.kts']:
                          filepath = os.path.join(root, file)
                          try:
                              with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                                  content = f.read()
                              
                              # Replace compileSdkVersion 33 / compileSdk = 33 with 36
                              content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)
                              content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
                              
                              with open(filepath, 'w', encoding='utf-8') as f:
                                  f.write(content)
                          except Exception:
                              pass

          # 2. Update local App Gradle files
          for app_gradle in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(app_gradle):
                  with open(app_gradle, 'r') as f:
                      content = f.read()
                  content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)
                  content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
                  with open(app_gradle, 'w') as f:
                      f.write(content)
          "

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportManagerPro-Release
          path: build/app/outputs/flutter-apk/app-release.apk
