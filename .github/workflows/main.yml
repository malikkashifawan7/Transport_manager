name: Mobile APK Builder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: flutter create . --platforms=android

      - name: Force SDK 36 for All Plugins Safely
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          python3 -c "
          import os

          # Inject into android/build.gradle or android/build.gradle.kts
          target_file = 'android/build.gradle.kts' if os.path.exists('android/build.gradle.kts') else 'android/build.gradle'

          code_kts = '''
          subprojects {
              plugins.whenPluginAdded {
                  if (this.javaClass.name.contains(\"AndroidPlugin\")) {
                      val android = extensions.findByName(\"android\") as? com.android.build.gradle.BaseExtension
                      android?.compileSdkVersion(36)
                  }
              }
          }
          '''

          code_groovy = '''
          subprojects {
              plugins.whenPluginAdded { plugin ->
                  if (plugin.class.name.contains('AndroidPlugin')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          '''

          if target_file.endswith('.kts'):
              with open(target_file, 'a') as f:
                  f.write(code_kts)
          else:
              with open(target_file, 'a') as f:
                  f.write(code_groovy)
          "

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportManagerPro-Release
          path: build/app/outputs/flutter-apk/app-release.apk
