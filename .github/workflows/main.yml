name: Mobile APK Builder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: flutter create . --platforms=android

      - name: Force SDK 36 via Settings Gradle
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          
          python3 -c "
          import os

          settings_file = 'android/settings.gradle.kts' if os.path.exists('android/settings.gradle.kts') else 'android/settings.gradle'
          
          kotlin_settings_patch = '''
          gradle.beforeProject {
              plugins.withId(\"com.android.application\") {
                  val android = extensions.findByName(\"android\") as? com.android.build.gradle.BaseExtension
                  android?.compileSdkVersion(36)
              }
              plugins.withId(\"com.android.library\") {
                  val android = extensions.findByName(\"android\") as? com.android.build.gradle.BaseExtension
                  android?.compileSdkVersion(36)
              }
          }
          '''

          groovy_settings_patch = '''
          gradle.beforeProject { p ->
              p.plugins.withId('com.android.application') {
                  p.android.compileSdkVersion 36
              }
              p.plugins.withId('com.android.library') {
                  p.android.compileSdkVersion 36
              }
          }
          '''

          if os.path.exists('android/settings.gradle.kts'):
              with open('android/settings.gradle.kts', 'a') as f:
                  f.write(kotlin_settings_patch)
          elif os.path.exists('android/settings.gradle'):
              with open('android/settings.gradle', 'a') as f:
                  f.write(groovy_settings_patch)
          "

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportManagerPro-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          
