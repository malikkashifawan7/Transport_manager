name: Mobile APK Builder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: flutter create . --platforms=android

      - name: Inject Global SDK 36 Override
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          
          python3 -c "
          import os

          groovy_override = '''
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          '''

          kotlin_override = '''
          subprojects {
              afterEvaluate {
                  val android = extensions.findByName(\"android\") as? com.android.build.gradle.BaseExtension
                  android?.compileSdkVersion(36)
              }
          }
          '''

          if os.path.exists('android/build.gradle'):
              with open('android/build.gradle', 'a') as f:
                  f.write(groovy_override)

          if os.path.exists('android/build.gradle.kts'):
              with open('android/build.gradle.kts', 'a') as f:
                  f.write(kotlin_override)
          "

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportManagerPro-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          
