name: Mobile APK Builder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: flutter create . --platforms=android

      - name: Force Global SDK 35
        run: |
          python3 -c "
          import os

          # Update settings.gradle / settings.gradle.kts if needed or root build file
          root_build = 'android/build.gradle.kts' if os.path.exists('android/build.gradle.kts') else 'android/build.gradle'
          
          override_script = '''
          subprojects {
              afterEvaluate {
                  if (plugins.hasPlugin('com.android.application') || plugins.hasPlugin('com.android.library')) {
                      configure<com.android.build.gradle.BaseExtension> {
                          compileSdkVersion(35)
                      }
                  }
              }
          }
          '''
          
          if os.path.exists('android/build.gradle'):
              with open('android/build.gradle', 'a') as f:
                  f.write('''
                  subprojects {
                      project.configurations.all {
                          resolutionStrategy.eachDependency {
                              if (requested.group == 'com.android.support') {
                                  skip()
                              }
                          }
                      }
                      afterEvaluate { project ->
                          if (project.hasProperty('android')) {
                              project.android {
                                  compileSdkVersion 35
                              }
                          }
                      }
                  }
                  ''')
          elif os.path.exists('android/build.gradle.kts'):
              with open('android/build.gradle.kts', 'a') as f:
                  f.write(override_script)
          "

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportManagerPro-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          
