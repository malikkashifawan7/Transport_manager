name: Mobile APK Builder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project
        run: flutter create . --platforms=android

      - name: Override SDK 36 Safe Injection
        run: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          python3 -c "
          import os

          groovy_build = 'android/build.gradle'
          kotlin_build = 'android/build.gradle.kts'

          groovy_code = '''
          subprojects {
              project.buildDir = \"${rootProject.buildDir}/${project.name}\"
              project.evaluationDependsOn(':app')
          }
          subprojects {
              plugins.withId('com.android.library') {
                  android { compileSdkVersion 36 }
              }
              plugins.withId('com.android.application') {
                  android { compileSdkVersion 36 }
              }
          }
          '''

          kotlin_code = '''
          subprojects {
              plugins.withId(\"com.android.library\") {
                  configure<com.android.build.gradle.BaseExtension> {
                      compileSdkVersion(36)
                  }
              }
              plugins.withId(\"com.android.application\") {
                  configure<com.android.build.gradle.BaseExtension> {
                      compileSdkVersion(36)
                  }
              }
          }
          '''

          if os.path.exists(groovy_build):
              with open(groovy_build, 'a') as f:
                  f.write(groovy_code)

          if os.path.exists(kotlin_build):
              with open(kotlin_build, 'a') as f:
                  f.write(kotlin_code)
          "

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransportManagerPro-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          
